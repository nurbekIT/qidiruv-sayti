<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O'yin — Qahramonlarni top</title>
<link rel="stylesheet" href="style.css">
<script>
  if(localStorage.getItem("qs_animations") === "off"){
    document.documentElement.classList.add("no-animations");
  }
</script>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="nav-logo">🦸 Qahramonlar bazasi</a>
    <div class="nav-links">
      <a href="index.html">Bosh sahifa</a>
      <a href="game.html" class="active">O'yin</a>
      <a href="settings.html">Sozlamalar</a>
    </div>
  </div>
</nav>

<header>
  <h1>Qahramonni top!</h1>
  <p>Rasmga qarab, ismini va qaysi anime/kino/multfilmdan ekanini toping</p>
</header>

<main>
  <div class="game-wrap">
    <div class="score-row">
      <span id="scoreText">To'g'ri: 0 / 0</span>
      <button class="ghost-btn" id="resetScoreBtn">Hisobni tozalash</button>
    </div>

    <div class="game-card">
      <img id="gameImg" src="" alt="Qahramon rasmi">
    </div>

    <div class="game-inputs" id="gameInputs">
      <input type="text" id="guessName" placeholder="Ismi kim? (masalan: Gojo)">
      <input type="text" id="guessSource" placeholder="Qaysi anime/kino/multfilmdan? (masalan: Jujutsu Kaisen)">
      <button id="checkBtn">Tekshirish</button>
    </div>

    <div class="game-result" id="gameResult" hidden></div>

    <button class="next-btn" id="nextBtn" hidden>Keyingi savol →</button>
  </div>
</main>

<script src="game.js"></script>
</body>
</html>
